name: Release

# Triggered by pushing a tag like `v0.1.0`. Cross-compiles the tictock binary
# for macOS (arm64 + x86_64), Linux (x86_64 + arm64), and Windows (x86_64),
# then attaches the archives to a GitHub Release. The Homebrew formula and
# install.sh both fetch these exact archive names, so keep them in sync if
# you change this file.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compiler
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure linker for cross target
        if: matrix.linker != ''
        run: |
          mkdir -p .cargo
          echo "[target.${{ matrix.target }}]" >> .cargo/config.toml
          echo "linker = \"${{ matrix.linker }}\"" >> .cargo/config.toml

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tictock dist/
          cp README.md LICENSE dist/
          tar -C dist -czf tictock-${{ matrix.target }}.tar.gz tictock README.md LICENSE

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tictock.exe dist/
          cp README.md LICENSE dist/
          cd dist && 7z a ../tictock-${{ matrix.target }}.zip tictock.exe README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: tictock-${{ matrix.target }}
          path: tictock-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
