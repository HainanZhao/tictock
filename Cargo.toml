[package]
name = "tictock"
version = "0.7.1"
edition = "2021"
description = "A polished, configurable terminal clock with 18 distinctive faces"
license = "MIT"
repository = "https://github.com/HainanZhao/tictock"
readme = "README.md"
authors = ["Hainan Zhao"]

[[bin]]
name = "tictock"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "5"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
